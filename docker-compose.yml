# AdAstra Sky — pila completa autoalojable (PostgreSQL + ai-service + backend + frontend).
#
#   cp .env.compose.example .env      # y rellena los valores
#   docker compose up -d --build      # o: podman-compose up -d --build
#
#   Frontend:   http://localhost:8080
#   Backend:    http://localhost:5000  (Swagger desactivado en producción)
#   ai-service: http://localhost:8001/docs
#
# Los datos de PostgreSQL viven en el volumen «pgdata». Copia de seguridad:
#   SOURCE_DATABASE_URL=postgresql://postgres:<pass>@localhost:5432/adastrasky bash database/migration/export_db.sh

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adastrasky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adastrasky"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai:
    build: ./ai-service
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Define AI_SERVICE_API_KEY en .env}
      BACKEND_URL: http://backend:5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:8001:7860"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/adastrasky
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AI_SERVICE_URL: http://ai:7860
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      NASA_API_KEY: ${NASA_API_KEY:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
