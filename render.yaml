# Render Blueprint — AdAstra Sky
# https://render.com/docs/blueprint-spec

services:
  # ─── Backend (Node.js + Express) ───────────────────────────
  - type: web
    name: adastra-sky-backend
    runtime: node
    repo: https://github.com/Ithaisa1/AdastraSky
    branch: main
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Base de datos externa (Neon): la PostgreSQL gratuita de Render caduca a los 30 días
      # y se borra 14 días después. Pega aquí la cadena de conexión de Neon.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: AI_SERVICE_API_KEY
        sync: false
      # Dirección del servicio de IA: el Space de Hugging Face
      # (https://ithaisa-adastrasky-ai-service.hf.space) o el servicio adastra-sky-ai de abajo
      - key: AI_SERVICE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://adastrasky.vercel.app,https://adastra-sky.vercel.app
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false

  # ─── AI Service (FastAPI + LangGraph) ──────────────────────
  - type: web
    name: adastra-sky-ai
    runtime: python
    repo: https://github.com/Ithaisa1/AdastraSky
    branch: main
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: mistralai/Mistral-7B-Instruct-v0.3
      - key: FRONTEND_URL
        value: https://adastrasky.vercel.app,https://adastra-sky.vercel.app
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: BACKEND_URL
        value: https://adastra-sky-backend.onrender.com

# Sin base de datos de Render: se usa Neon (ver docs/14_MIGRACION_BASE_DE_DATOS.md).
